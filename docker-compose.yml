x-airflow-common: &airflow-common
  image: apache/airflow:latest-python3.14
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__API__BASE_URL: 'http://localhost/airflow'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/airflow/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: 'DnP0cozSsx4FjC4nRVUNWZxcJlGSgNZ46Xr2S6T_HGp5kA7_br8aMt72k3uOXWLj3ILu6FukTGDQxLbsOvlNHw'
    AIRFLOW__API__SECRET_KEY: 'DnP0cozSsx4FjC4nRVUNWZxcJlGSgNZ46Xr2S6T_HGp5kA7_br8aMt72k3uOXWLj3ILu6FukTGDQxLbsOvlNHw'
    # Stable worker hostname for served logs (LocalExecutor runs tasks on scheduler)
    AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
    AIRFLOW__LOGGING__TASK_LOG_READER: task
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: '8793'
    # Prevent corporate/system proxies from breaking internal log URLs
    HTTP_PROXY: ''
    HTTPS_PROXY: ''
    http_proxy: ''
    https_proxy: ''
    NO_PROXY: 'airflow-scheduler,airflow-apiserver,airflow-dag-processor,postgres,localhost,127.0.0.1'
    no_proxy: 'airflow-scheduler,airflow-apiserver,airflow-dag-processor,postgres,localhost,127.0.0.1'
    # Used by /clean-logs groomer (not a core Airflow config section)
    AIRFLOW__LOG_RETENTION_DAYS: '1'
    AIRFLOW__LOG_CLEANUP_FREQUENCY_MINUTES: '60'
    FORWARDED_ALLOW_IPS: '*'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    hostname: airflow-apiserver
    command: api-server --workers 1 --proxy-headers
    # Keep 8080 for direct access/debug; primary URL is http://localhost/airflow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/airflow/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # Deletes *.log files under ./logs older than AIRFLOW__LOG_RETENTION_DAYS
  airflow-log-groomer:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
      AIRFLOW__LOG_RETENTION_DAYS: "1"
      AIRFLOW__LOG_CLEANUP_FREQUENCY_MINUTES: "60"
    command: bash /clean-logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-init:
    <<: *airflow-common
    # Entrypoint creates Admin from _AIRFLOW_WWW_USER_*; then we ensure Viewer exists
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/airflow/logs/dag_processor
        chown -R airflow:root /opt/airflow/logs 2>/dev/null || true
        airflow users create \
          --username "$${AIRFLOW_READONLY_USER}" \
          --firstname Read \
          --lastname Only \
          --role Viewer \
          --email readonly@example.com \
          --password "$${AIRFLOW_READONLY_PASSWORD}" \
          || true
        airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
      _AIRFLOW_WWW_USER_ROLE: Admin
      AIRFLOW_READONLY_USER: ${AIRFLOW_READONLY_USER:-readonly}
      AIRFLOW_READONLY_PASSWORD: ${AIRFLOW_READONLY_PASSWORD:-readonly}

volumes:
  postgres-db-volume:
