map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    # Accept localhost and LAN IP (Host header from browser)
    server_name localhost 192.168.100.124 _;

    # Bare host (http://IP/) used to look like a white/empty page — send to UI
    location = / {
        return 301 /airflow/;
    }

    # Redirect /airflow -> /airflow/
    location = /airflow {
        return 301 /airflow/;
    }

    # Official Airflow reverse-proxy pattern: pass full path, no rewrite
    # Do NOT use proxy_cookie_path — Airflow already sets Path=/airflow/
    location /airflow/ {
        proxy_pass http://airflow-apiserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 100m;
        # Airflow UI uses iframes for some auth manager links
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Airflow UI sometimes calls logout/auth WITHOUT the /airflow prefix
    location = /api/v2/auth/logout {
        proxy_pass http://airflow-apiserver:8080/airflow/api/v2/auth/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location /auth/ {
        proxy_pass http://airflow-apiserver:8080/airflow/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://airflow-apiserver:8080/airflow/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
